[project]
name = "school-api"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.12",
    "prometheus-client>=0.21.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.34.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-cov>=6.1.1",
    "pytest>=8.3.5",
    "ruff>=0.11.5",
]
