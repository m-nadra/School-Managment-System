services:
  frontend:
    build: ./frontend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./frontend/package.json
    ports:
      - "80:80"
    networks:
      - app_network

  backend:
    build: ./backend
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./backend/pyproject.toml        
    ports:
      - "5000:5000"
    environment:
      - FRONTEND_URL=http://frontend:80
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
